# electron-builder 打包配置（由 `npm run electron:win` 在 client 目录下触发）
appId: com.movieroom.app
productName: Movie Room
copyright: Copyright © 2026 Movie Room

directories:
  # 打包产物输出目录（相对 client/）
  output: release
  buildResources: public

# 打包进 app.asar 的内容
# 注意：渲染层依赖已被 vite 打进 dist，无需携带 node_modules，安装包更小
files:
  - dist/**/*
  - src/main/**/*
  - public/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Movie Room
  artifactName: Movie-Room-Setup-${version}.${ext}
