<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Room - 共享观影室</title>
    <!--
      内容安全策略：限制脚本与资源来源，降低注入类漏洞的利用面。
      connect-src 需包含 ws: 以便 WebRTC 信令（socket.io）在开发/生产环境连接。
      media-src blob: 用于播放本地视频与 HLS 分片。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' ws: wss: http://localhost:3001 http://127.0.0.1:3001; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
